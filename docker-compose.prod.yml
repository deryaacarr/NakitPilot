# NP-180 — production compose stack
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Requires secrets in .env (SECRET_KEY, JWT_SIGNING_KEY, POSTGRES_PASSWORD, …).
# DEBUG must be false in production.

name: nakitpilot-prod

x-restart: &restart
  restart: unless-stopped

x-api-env: &api-env
  DEBUG: "false"
  DATABASE_URL: postgresql://${POSTGRES_USER:-nakitpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nakitpilot}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx,web}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
  PRIVATE_UPLOAD_ROOT: /app/private_uploads
  COLLECTSTATIC: "0"
  RUN_MIGRATIONS: "1"

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    container_name: nakitpilot-prod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakitpilot}
      POSTGRES_USER: ${POSTGRES_USER:-nakitpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nakitpilot} -d ${POSTGRES_DB:-nakitpilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - nakitpilot

  redis:
    <<: *restart
    image: redis:7-alpine
    container_name: nakitpilot-prod-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - nakitpilot

  api:
    <<: *restart
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: nakitpilot-prod-api
    env_file:
      - .env
    environment:
      <<: *api-env
    volumes:
      - api_static:/app/staticfiles
      - api_media:/app/media
      - api_uploads:/app/private_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/ready/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - nakitpilot

  celery_worker:
    <<: *restart
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: nakitpilot-prod-celery-worker
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "0"
    volumes:
      - api_uploads:/app/private_uploads
      - api_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - nakitpilot

  celery_beat:
    <<: *restart
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: nakitpilot-prod-celery-beat
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "0"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - nakitpilot

  web:
    <<: *restart
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NakitPilot}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    container_name: nakitpilot-prod-web
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NakitPilot}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    networks:
      - nakitpilot

  nginx:
    <<: *restart
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: nakitpilot-prod-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      TLS_CN: ${TLS_CN:-localhost}
    volumes:
      - api_static:/var/www/static:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - nakitpilot

volumes:
  postgres_data:
  redis_data:
  api_static:
  api_media:
  api_uploads:
  nginx_certs:

networks:
  nakitpilot:
    driver: bridge
