name: nakitpilot

services:
  postgres:
    image: postgres:16-alpine
    container_name: nakitpilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakitpilot}
      POSTGRES_USER: ${POSTGRES_USER:-nakitpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nakitpilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nakitpilot} -d ${POSTGRES_DB:-nakitpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nakitpilot

  redis:
    image: redis:7-alpine
    container_name: nakitpilot-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nakitpilot

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: nakitpilot-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nakitpilot}:${POSTGRES_PASSWORD:-nakitpilot}@postgres:5432/${POSTGRES_DB:-nakitpilot}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALLOWED_HOSTS: localhost,127.0.0.1,api,nginx,web
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./apps/api:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/live/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nakitpilot

  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: nakitpilot-celery-worker
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nakitpilot}:${POSTGRES_PASSWORD:-nakitpilot}@postgres:5432/${POSTGRES_DB:-nakitpilot}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RUN_MIGRATIONS: "0"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - nakitpilot

  celery_beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: nakitpilot-celery-beat
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nakitpilot}:${POSTGRES_PASSWORD:-nakitpilot}@postgres:5432/${POSTGRES_DB:-nakitpilot}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RUN_MIGRATIONS: "0"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - nakitpilot

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: nakitpilot-web
    environment:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NakitPilot}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      SENTRY_DSN: ${SENTRY_DSN:-}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - nakitpilot

  nginx:
    image: nginx:1.27-alpine
    container_name: nakitpilot-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - nakitpilot

volumes:
  postgres_data:
  web_node_modules:

networks:
  nakitpilot:
    driver: bridge
